[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
dotenv = "0.15"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde_yaml = "0.9"
async-trait = "0.1"
glob = "0.3"
# 新增：精简优化引入
eventsource-stream = "0.2"
encoding_rs = "0.8"
path-clean = "1"
dunce = "1"
thiserror = "2"