name: Test

# 只关注 bytemaker:仅当 bytemaker/ 或本 workflow 文件变动时才跑。
# 需要 API key 的 #[ignore] 测试不会被普通 cargo test 触发,CI 安全。
on:
  push:
    branches: [main]
    paths:
      - bytemaker/**
      - .github/workflows/test.yml
  pull_request:
    branches: [main]
    paths:
      - bytemaker/**
      - .github/workflows/test.yml

jobs:
  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bytemaker

    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # ubuntu-latest 自带 Rust stable。
      - name: Run tests
        run: cargo test --all-targets
